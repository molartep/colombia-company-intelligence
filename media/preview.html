<!doctype html><html lang="es"><meta charset="utf-8"><title>Colombia Company Intelligence — Media review</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f8f7;color:#17333c;font:16px 'Avenir Next',sans-serif}header{background:black;color:white;padding:16px 30px;display:flex;gap:20px;align-items:center}header img{width:48px;height:48px;object-fit:contain}main{padding:24px}button,input{font:inherit;padding:8px 14px;border:1px solid #7b8d85;border-radius:6px;background:white;color:#17333c;margin-right:10px}button[aria-pressed=true]{background:#183e40;color:white}video{display:block;background:white;max-width:100%;width:100%;margin-top:18px;border:1px solid #dce3df}output{margin-left:12px;font-variant-numeric:tabular-nums}.gif{max-width:100%;margin-top:20px}a{color:#285f4b}</style><header><img src="remotion/public/colombia-network-logo.png" alt="Official product logo"><strong>Colombia Company Intelligence · Media review</strong></header><main><div><button data-asset="promo">Promo · 30 s</button><button data-asset="walkthrough">Walkthrough · 60 s</button><button data-asset="loop">Loop · 12 s</button><button id="half">0.5×</button><button id="normal" aria-pressed="true">1×</button><label>Ir al segundo <input id="seek" type="number" value="0" min="0" max="60" step="0.1" style="width:90px"></label><button id="jump">Ir</button><output id="clock">0.00 s</output></div><video id="video" controls muted playsinline></video><p>Comprobar composición a escala reducida: <button data-scale="1">100%</button><button data-scale="0.5">50%</button><button data-scale="0.25">25%</button></p><p><a href="exports/colombia-company-intelligence-demo.gif">Abrir GIF animado</a> · <a href="exports/colombia-company-intelligence-poster.png">Poster</a></p></main><script>const v=document.querySelector('video'),clock=document.querySelector('#clock');const files={promo:'promo-30s',walkthrough:'walkthrough-60s',loop:'demo-loop'};function select(k){v.src='exports/colombia-company-intelligence-'+files[k]+'.mp4?review='+Date.now();document.querySelectorAll('[data-asset]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.asset===k)))}document.querySelectorAll('[data-asset]').forEach(b=>b.onclick=()=>select(b.dataset.asset));document.querySelector('#half').onclick=()=>{v.playbackRate=.5;document.querySelector('#half').setAttribute('aria-pressed','true');document.querySelector('#normal').setAttribute('aria-pressed','false')};document.querySelector('#normal').onclick=()=>{v.playbackRate=1;document.querySelector('#normal').setAttribute('aria-pressed','true');document.querySelector('#half').setAttribute('aria-pressed','false')};document.querySelector('#jump').onclick=()=>v.currentTime=Number(document.querySelector('#seek').value);v.ontimeupdate=()=>clock.value=v.currentTime.toFixed(2)+' s';document.querySelectorAll('[data-scale]').forEach(b=>b.onclick=()=>v.style.width=(Number(b.dataset.scale)*100)+'%');select('promo');</script></html>
