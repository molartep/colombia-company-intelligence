services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cci}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cci}
      POSTGRES_DB: ${POSTGRES_DB:-cci}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cci}:${POSTGRES_PASSWORD:-cci}@db:5432/${POSTGRES_DB:-cci}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-cci}:${POSTGRES_PASSWORD:-cci}@db:5432/${POSTGRES_DB:-cci}
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["capital_markets_data:/app/var/capital-markets"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports: ["127.0.0.1:5173:5173"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/', { signal: AbortSignal.timeout(3000) }).then(response => { if (!response.ok) process.exitCode = 1 }).catch(() => { process.exitCode = 1 })"
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s
  test-db:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: cci
      POSTGRES_PASSWORD: cci
      POSTGRES_DB: cci_test
    ports: ["127.0.0.1:5433:5432"]
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cci -d cci_test"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres_data:
  capital_markets_data:
