name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cci
          POSTGRES_PASSWORD: cci
          POSTGRES_DB: cci_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cci -d cci_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cci:cci@localhost:5432/cci_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - run: pip install -r requirements-dev.lock && pip install --no-deps -e .
      - run: ruff check . && ruff format --check . && mypy app
      - run: pytest -q
      - run: pip wheel --no-deps . -w /tmp/wheels
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Start services and wait for HTTP readiness
        run: docker compose up --build --wait --wait-timeout 120
      - name: Verify published backend and frontend ports
        run: |
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 --connect-timeout 3 --max-time 10 http://127.0.0.1:8000/ready
          curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 1 --connect-timeout 3 --max-time 10 http://127.0.0.1:5173/ --output /dev/null
      - name: Verify backend browser runtime
        run: |
          docker compose exec -T backend python - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as driver:
                  browser = await driver.chromium.launch(channel="chromium", headless=True)
                  assert browser.is_connected()
                  await browser.close()
          asyncio.run(main())
          PY
      - name: Service status and logs
        if: always()
        run: |
          docker compose ps --all
          docker compose logs --no-color --timestamps
      - name: Clean up test containers
        if: always()
        run: docker compose down -v
